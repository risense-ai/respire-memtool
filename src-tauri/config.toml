# ============================================================
# memTools 配置（用户可改）
# 红线：不得启停 rsrs 服务、不得使用 --direct、不得 shell 拼接调用
# ============================================================

# ---- 全局热键 ----
[hotkey]
# 唤起/隐藏小窗的全局快捷键（tauri-plugin-global-shortcut 语法）
register = "Ctrl+Alt+R"

# ---- 窗口行为 ----
[window]
width = 480
height = 560
always_on_top = true
decorations = false        # 无边框（前端自绘圆角毛玻璃）
transparent = true
remember_position = true   # 记忆上次窗口位置
submit_close = true        # 提交成功后短暂回显并自动关闭

# ---- rsrs 连接（MCP over HTTP，loopback）----
[rsrs]
# 基础地址：rsrs runtime 的 loopback HTTP 端口（默认 15169）
base_url = "http://127.0.0.1:15169"
# MCP over HTTP 端点：POST {base_url}/{mcp_path}（JSON-RPC 2.0）
mcp_path = "mcp"
# 快速探测超时（status/taxonomy）
timeout_secs = 5
# 慢操作超时（remember/recall/update/attach/show/tree）
# 说明：rsrs 插件 hook（如 mind3D bridge）可能使 recall/remember 耗时 >5s，故放宽
op_timeout_secs = 30

# memory_* MCP 工具名映射（rsrs runtime 暴露的工具，可随服务端调整）
[rsrs.tools]
status = "memory_status"
taxonomy = "memory_taxonomy"
remember = "memory_remember"
recall = "memory_recall"
tree = "memory_tree"
show = "memory_show"
update = "memory_update"
attach = "memory_attach"
list = "memory_list"
query_log_mark = "memory_query_log_mark"

# ---- 自动化（P2 已开放）----
[automation]
enabled = false
mode = "local-fallback"    # high-quality | memory-gateway | local-fallback
recall_rounds = 2          # 判重轮数
recall_limit = 3           # 每轮候选上限
dup_threshold = 0.85       # 相似度 >= 此值视为疑似重复 → 需用户确认（改/并）
attach_threshold = 0.70    # 相似度 >= 此值视为同题 → 自动挂其下

# ---- 模型判档 / 判树（P2 模型路径）----
# 任意 OpenAI 兼容端点：memory-gateway（默认 :8125）、Ollama、vLLM 等。
# mode = "local-fallback" 时完全不调用；mode = "high-quality" 或 "memory-gateway" 时启用。
# 调用失败会自动回退本地判档/判树，并在结果里给出告警（不静默）。
[automation.llm]
enabled = false
endpoint = "http://127.0.0.1:8125/v1/chat/completions"
model = "qwen3:8b"
api_key = ""              # 留空则不发 Authorization 头
timeout_secs = 60

# ---- 提醒（P5）----
# 扫描含【触发】的 task 条目，在「提醒」视图与底栏徽标提示到期/逾期。
# rsrs CLI 没有后台提醒；这里是 UI 侧定时核对（start + 每 interval_minutes 分钟）。
[reminder]
enabled = true
interval_minutes = 30
soon_days = 7             # 未来 N 天内视为「即将到期」

# ---- 浏览器扩展端点（P6-②）----
# 仅绑定 127.0.0.1，供本机 Chrome/Edge 扩展提交网页选中文字。
# token 留空 = 首次启动自动生成，写入 {app_config_dir}/extension_token.txt；
# 也可在此填固定值（不建议提交到公开仓库）。
[extension]
enabled = true
port = 17650
token = ""

# ---- 自动更新（P7）----
# 客户端 GET endpoint 取 update.json，比版本 → 下载 exe → SHA-256 校验 →
# 由新 exe 以 --apply-update 等待旧进程退出后自替换并重启。
# 本机演示需显式将 endpoint 改为 http://127.0.0.1:17651/update.json，并运行 node devtools/update-server.mjs。
# 公网分发：把 update.json 与 exe 放到 Gitee / 对象存储，改这里的 endpoint 即可。
[update]
enabled = true
endpoint = "https://github.com/risense-ai/respire-memtool/releases/latest/download/update.json"
check_on_start = true

# ---- rsrs CLI 自动安装 / 更新（P11）----
# 全新机器上若没有 rsrs 命令，memTools 首次启动会自动用 npm/pnpm 全局安装，
# 并在小窗底栏「rsrs」面板显示安装进度；装好后也可在同一面板手动检查/更新。
# 只安装包，不启动、停止或重启 rsrs runtime，也不使用 --direct。
[rsrs_cli]
auto_install = true                # 首次启动未检测到 rsrs 时自动安装
package = "rsrs-cli"               # 官方短名入口（与 @rsrsai/cli 同仓库同命令，勿同装）
fallback_package = "@rsrsai/cli"   # 短名在镜像上未同步时回退

# ---- 全局划词悬浮（P8）----
# 安装 WH_MOUSE_LL 低级鼠标钩子：拖选 / 双击选词后先在光标右下弹出小图标，
# **此时不取词**；点图标才模拟一次 Ctrl+C 取词，再询问「存为日记 / 在 memTools 中编辑」。
# 终端类窗口与内嵌终端的宿主（VS Code 等）一律不注入，改由剪贴板监听唤出图标 ——
# 往里注入 Ctrl+C 等于给 TUI 发 0x03，会中断甚至退出正在跑的程序。
# 托盘右键「划词悬浮」可随时开关（此处只决定启动时的初始状态）。
# 取词会短暂占用剪贴板，仅在剪贴板仍是本次结果时才还原原来的文本剪贴板。
[selection]
enabled = true
min_chars = 2             # 少于该字数不弹图标（避免误触）
max_chars = 4000          # 超过则忽略（超长内容请到 memTools 分段记录）
drag_threshold_px = 8     # 拖选判定：按下到抬起的位移阈值（物理像素）
capture_timeout_ms = 600  # 点击图标后等待剪贴板更新的上限
double_click = true       # 双击选词也弹图标
offset_px = 14            # 图标相对光标的偏移
clipboard_arm_ms = 1200   # 拖选后多久内的复制算本次划词（剪贴板归因窗口）
# 不注入取词的进程名黑名单：这些窗口只监听剪贴板，不向它发任何键。
# 主要针对内嵌终端的宿主（窗口类与普通编辑器相同，只能按进程名区分）。
no_inject_processes = [
  "Code.exe", "Code - Insiders.exe", "Cursor.exe", "Windsurf.exe", "Trae.exe", "Qoder.exe",
  "WindowsTerminal.exe", "wt.exe", "OpenConsole.exe", "conhost.exe",
  "wezterm-gui.exe", "alacritty.exe", "mintty.exe", "Hyper.exe", "Tabby.exe",
  "FluentTerminal.exe", "ConEmu.exe", "ConEmu64.exe", "Terminus.exe",
]

# ---- 内容梳理（P10）----
# 两条路径，按下面两个开关择一（agent_endpoint 非空 或 agent.enabled = true → 走 agent）：
#   层次一（默认）：直连任意 OpenAI 兼容端点（memory-gateway / Ollama / vLLM），最快最省。
#   层次二：交给本机 agent 的 headless 入口（opencode / Qoder），适合需要 agent 工具/skill 的场景。
# 关闭 enabled 时 /process 与「梳理后保存」直接 503，不调用模型也不调 agent。
# 日常切换来源不用改这里：小窗点「梳理」→「来源」下拉（模型 / opencode / Qoder / 关闭），
# 选择会存到 {app_config_dir}/processor.json 并立即生效；本文件只提供默认值与高级参数。
[processor]
enabled = true
endpoint = "http://127.0.0.1:8125/v1/chat/completions"
model = "qwen3:8b"
api_key = ""              # 留空则不发 Authorization 头
timeout_secs = 120        # 模型调用超时（梳理比判档慢，默认更宽）
max_chars = 8000          # 送入模型的内容上限（超长直接拒绝）
# 层次二：agent 服务地址。留空 = 只看 [processor.agent] enabled；
# 非空 = 直接用 agent（opencode 会作为 --attach 目标，例如已 `opencode serve` 在 4096）。
agent_endpoint = ""

# ---- 层次二：agent headless 调用（opencode / Qoder / 自定义 CLI）----
# memTools 用「子进程 + 参数数组」直调 agent CLI，不拼 shell 字符串（防注入）。
# 默认工作目录是 {系统临时目录}/memtools-agent，避免 agent 把 memTools 仓库当项目。
[processor.agent]
enabled = false          # 默认走层次一；小窗「来源」下拉选 opencode/Qoder 会自动启用（写入 processor.json）
kind = "opencode"         # opencode | qoder | custom
bin = ""                  # 留空自动探测：PATH → 已知安装位置；也可填完整路径（custom 必填）
model = ""                # opencode: provider/model（如 opencode/big-pickle）；qoder: auto/efficient/qmodel…
agent = ""                # opencode --agent（用自定义 agent 限定工具/权限，建议配一个纯文本 agent）
timeout_secs = 240        # agent 冷启动慢，超时后杀进程并明确报错
workdir = ""              # 留空 = {temp}/memtools-agent
auto = false              # opencode --auto：自动批准未被显式拒绝的权限项（知识库任务不需要，权限已写死）
# 注：旧版 `pure = true`（--pure）在 opencode v2 已移除，配置里保留该键会被忽略。
max_turns = 0             # qoder --max-turns（0 = 不传；设 1 可减少工具循环）
allowed_tools = ""        # qoder --allowed-tools（逗号分隔，留空不传）
disallowed_tools = ""     # qoder --disallowed-tools（如 "Bash,Edit,Write"，留空不传）
extra_args = []           # 追加参数（原样传给 CLI）
token = ""                # 令牌（勿提交到公开仓库）；非空则注入到 token_env
token_env = ""            # 令牌环境变量名，留空按 kind：qoder → QODER_PERSONAL_ACCESS_TOKEN
# ---- 以下四项仅 kind = "custom" 使用：用户装了什么 CLI 就配什么 ----
# args：参数模板，数组里每个元素是一个 argv；留空等价于 ["{prompt}"]。
#   占位符：{prompt} {model} {session} {endpoint} {workdir} {agent}；替换后为空串的元素会被丢弃。
#   例（Claude Code 风格）：args = ["-p", "{prompt}", "--output-format", "json", "--model", "{model}"]
args = []
# env：附加环境变量，每个元素写成 KEY=VALUE
env = []
# models：AI 窗口模型下拉的候选（仍可手填）；留空则只给自由输入
models = []
# output：输出解析方式 text | json | opencode-json | qoder-json（默认 text = 原样取 stdout）
output = ""
# 说明：
# - opencode 需先在 opencode.jsonc 配好 provider/model；`opencode run --format json` 输出事件流。
# - Qoder 需先登录：运行 `qodercli` 后输入 `/login`（或设 QODER_PERSONAL_ACCESS_TOKEN）；
#   其 CLI 通常位于 <Qoder 安装目录>/resources/app/resources/bin/x86_64_windows/qodercli.exe，
#   不在 PATH 时把 bin 填成完整路径即可。
# - custom 示例（把任意 CLI 包成 agent）：
#   kind = "custom"
#   bin = "crush"                      # 完整路径或 PATH 上的命令名
#   args = ["run", "--model", "{model}", "{prompt}"]
#   env = ["CI=1"]
#   models = ["claude-sonnet", "gpt-5"]
#   output = "json"                    # 或 text / opencode-json / qoder-json
# - 排查：curl -H "X-MemTools-Token: <token>" http://127.0.0.1:17650/agent

# prompt 模板可逐条覆盖（留空 = 用内置默认）。支持 {content} 与 {lang} 占位符。
# 示例：
# [processor.prompts]
# summarize = '''你的自定义总结 prompt，用 {content} 代表正文。'''

# ---- 知识库入库 + AI 窗口（P13）----
# 任何入库都按「一条资料一个文件夹」组织：
#   <root>/<年>/<月>/<主题-slug>-<时间戳>/
#     original/   原文件或原目录（原样保留）
#     <标题>.md   整理后的 Markdown
# 文本类（md/txt/csv/json/代码…）直接读；其它格式后续版本再支持。
# 界面里的根目录与右键菜单开关存到 {app_config_dir}/knowledge_base.json，叠加在本段之上。
[knowledge_base]
enabled = true
root = ""                    # 知识库根目录；留空 = 未设置，AI 窗口会提示选择
agent_kind = "opencode"      # 绑定的 agent：opencode | qoder（AI 窗口里可切换）
agent_bin = ""               # 可执行文件路径；留空自动探测
max_file_mb = 20             # 单个文件上限（MB），超过直接拒绝
max_files = 50               # 单次入库文件数上限（目录递归后计数）
timeout_secs = 600           # 单次 agent 调用超时（大目录整理更慢）
context_menu = true          # Windows：注册资源管理器右键「添加到 memTools 知识库」
# AI 用的模型（opencode 的 provider/model）。留空 = 跟随 [processor.agent] model。
agent_model = ""
# 研究类任务（网页解析 / 划词调研）是否允许联网检索
research_websearch = true
