<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>memTools · AI 与知识库</title>
  <link rel="stylesheet" href="./src/ai.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo-dot"></span>
      <span class="brand-name">memTools</span>
      <span class="brand-sub">AI · 知识库</span>
    </div>
    <div class="top-actions">
      <span id="status-chip" class="chip">读取状态…</span>
      <button id="btn-pick-root" class="btn" type="button" title="选择知识库根目录">知识库目录</button>
      <button id="btn-new-chat" class="btn" type="button" title="开始新对话">新对话</button>
    </div>
  </header>

  <main class="layout">
    <aside class="side">
      <section class="card">
        <div class="card-title">知识库</div>
        <div id="root-path" class="root-path">未设置</div>
        <div class="row">
          <button id="btn-add-folder" class="btn small" type="button">添加文件夹</button>
          <label class="switch" title="在资源管理器右键菜单里加入「添加到 memTools 知识库」">
            <input id="context-menu" type="checkbox" />
            <span>右键菜单</span>
          </label>
        </div>
        <div class="row">
          <input id="path-input" class="input" type="text" placeholder="粘贴文件 / 文件夹路径" spellcheck="false" />
          <button id="btn-add-path" class="btn small" type="button">添加</button>
        </div>
        <div class="row">
          <input id="url-input" class="input" type="text" placeholder="https://… 解析网页" spellcheck="false" />
          <button id="btn-add-url" class="btn small" type="button">解析</button>
        </div>
        <p class="hint">也可以把文件或文件夹直接拖进这个窗口。</p>
      </section>

      <section class="card grow">
        <div class="card-title">入库任务</div>
        <div id="tasks" class="tasks"></div>
      </section>
    </aside>

    <section class="chat">
      <div id="messages" class="messages">
        <div class="empty" id="chat-empty">
          <p>这是 memTools 的 AI 窗口。</p>
          <p class="dim">可以聊天，也可以把资料交给本地 agent 整理进知识库；整理结果会同时写入 rsrs 记忆。</p>
        </div>
      </div>
      <div class="composer">
        <textarea id="chat-input" rows="3" placeholder="问点什么，或描述要调研的主题…（Enter 发送，Shift+Enter 换行）" spellcheck="false"></textarea>
        <div class="composer-actions">
          <button id="btn-send" class="btn primary" type="button">发送</button>
          <button id="btn-stop" class="btn" type="button" disabled>停止</button>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="./src/ai.js"></script>
</body>
</html>
